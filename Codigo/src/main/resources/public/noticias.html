<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notícias | Nexus Invest</title>

    <link href="https://fonts.googleapis.com/css?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.7.3/src/md5.min.js"></script>
    <script src="/global.js"></script>
    
    <link rel="stylesheet" href="style.css" />

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // A responsabilidade de carregar a foto e o logout agora é toda do global.js!
        
        // Lógica padrão de navegação da equipa
        document.querySelectorAll('.btn-menu').forEach(function(btn) {
            btn.addEventListener('click', function() { 
                window.location.href = this.getAttribute('value'); 
            });
        });

        var mobileBtn = document.getElementById('mobile-menu-btn');
        if (mobileBtn) {
            mobileBtn.addEventListener('click', function() {
                var sidebar = document.querySelector('.sidebar');
                sidebar.classList.toggle('active');
                var icon = this.querySelector('i');
                icon.classList.toggle('fa-bars');
                icon.classList.toggle('fa-xmark');
            });
        }
      });
    </script>
  </head>

  <body class="layout-dashboard">
    <div class="app-container">
      <aside class="sidebar">
        <div class="logo-area">
          <div class="logo-group">
            <i class="fa-solid fa-chart-simple"></i> Nexus Invest
          </div>
          <button id="mobile-menu-btn" class="mobile-menu-btn">
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>

<nav class="menu">
  <button class="btn-menu" value="/dashboard"><i class="fa-solid fa-house"></i> Dashboard</button>
  <button class="btn-menu active" value="/noticias"><i class="fa-sharp-duotone fa-solid fa-newspaper"></i> Notícias</button>
  <button class="btn-menu" value="/simulation"><i class="fa-solid fa-money-bill-transfer"></i> Simulações</button>
  <button class="btn-menu" value="/metas"><i class="fa-solid fa-bullseye"></i> Metas</button>
  <button class="btn-menu" value="/topico"><i class="fa-solid fa-message"></i> Fórum</button>
  <button class="btn-menu" value="/tutorials"><i class="fa-solid fa-clapperboard"></i> Tutoriais</button>
</nav>

        <div class="menu-footer">
          <button class="btn-menu" value="/settings"><i class="fa-solid fa-gear"></i> Configurações</button>
          <button id="LogOutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sair</button>
        </div>
      </aside>

      <main class="main-content">
        <header class="top-bar">
          <div class="header-welcome">
            <h2>Noticias</h2>
            <span class="breadcrumbs">Notícias / Mercado</span>
          </div>
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Pesquisar..." />
            <div id="search-results" class="search-results"></div>
          </div>
          <div class="header-actions">
            <div class="user-profile">
              <div class="user-info">
                <span class="name">Carregando...</span>
                <span class="role">...</span>
              </div>
            </div>
          </div>
        </header>

        <div class="page-content">
          <div class="noticias">
            <div class="noticias_principais">
              <div class="carrossel-container"></div>
            </div>
            <div class="cardsnoticias"></div>
          </div>
        </div>
      </main>
    </div>
    <script src="noticias.js"></script>
  </body>
</html>
