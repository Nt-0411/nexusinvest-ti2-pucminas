<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Nexus Invest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/js-md5@0.7.3/src/md5.min.js"></script>
  <link rel="stylesheet" href="/style-login.css">
</head>
<body>

<div class="auth-card">

    <!-- MENSAGEM DE ERRO/SUCESSO -->
    <FORM-LOGIN>

    <div id="register-container" class="hidden">
        <div class="text-center mb-4">
            <h3 class="brand-title">Novo usuário</h3>
            <p class="brand-subtitle">Preencha os dados abaixo</p>
        </div>

        <div id="alerta-cadastro" class="alert-erro"></div>

        <form id="cadastro-form">
        <div class="text-center mb-3">
    <div class="photo-upload-container">
        <label for="txt_foto" style="cursor:pointer; display:block;">
            <img id="foto-preview" class="photo-preview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Foto">
            <div class="photo-overlay"><i class="bi bi-camera"></i></div>
        </label>
        <input type="file" id="txt_foto" accept="image/*" style="display:none" onchange="previewImagem(event)">
    </div>
</div>
            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label">Usuário (Login)</label>
                    <input type="text" id="txt_login" class="form-control" required>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label">Nome completo</label>
                    <input type="text" id="txt_nome" class="form-control" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" id="txt_email" class="form-control" required>
            </div>
            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label">Senha</label>
                    <input type="password" id="txt_senha" class="form-control" required>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label">Confirmação</label>
                    <input type="password" id="txt_senha2" class="form-control" required>
                </div>
            </div>
            <div class="d-flex justify-content-between mt-3">
                <button type="button" class="btn btn-secondary" onclick="toggleScreens()">Cancelar</button>
                <button type="button" id="btn_salvar" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>

</div>

<script src="/login.js"></script>

</body>
</html>
